# Home Church, the Android build.
#
# Trey works from a phone and the laptop only ever runs Xcode, so the Android
# app is built here rather than in Android Studio. Every push that touches
# the app builds two things:
#
#   home-church-android-aab   the bundle Google Play takes. Signed with the
#                             upload key when the four HC_UPLOAD_* secrets
#                             are set, unsigned otherwise (Play refuses an
#                             unsigned one, so those runs are checks only).
#   android-screens           the app on an Android emulator, phone screen
#                             screenshots, and the checks only a real Android
#                             build can answer. scripts/android_screens.js.
#
# The bundle also has to pass scripts/android_manifest_check.js: no
# permission the Data safety form does not account for, and every native
# library 16 KB aligned. PLAY_COMPLIANCE.md sections 1 and 2.
#
# versionCode is this workflow's run number, which only goes up, so Play
# never sees the same one twice and nobody has to raise it by hand.

name: Android

on:
  push:
    branches: [main, android-play]
    paths:
      - 'android/**'
      - 'index.html'
      - 'js/**'
      - 'css/**'
      - 'assets/**'
      - 'data/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/sync_web.js'
      - 'scripts/stamp_assets.js'
      - 'scripts/android_*'
      - '.github/workflows/android.yml'
  workflow_dispatch:

# Read the code, nothing else. No job here writes to the repository, opens an
# issue or touches a release, so the token every job is handed cannot either.
permissions:
  contents: read

# Every action is pinned to an exact commit rather than a tag, because a tag
# can be moved to new code by whoever controls it and the build job holds
# the upload key. The comment says which release each commit is. To update
# one, look up the new release's commit and change both together.

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HC_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Copy the web app into the Android project
        run: npm run android

      - name: The upload key, if it has been set up
        env:
          KEYSTORE_BASE64: ${{ secrets.HC_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.HC_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HC_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.HC_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No upload key in this repository's secrets. The bundle will be unsigned."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          {
            echo "HC_UPLOAD_STORE_FILE=$RUNNER_TEMP/upload.jks"
            echo "HC_UPLOAD_STORE_PASSWORD=$STORE_PASSWORD"
            echo "HC_UPLOAD_KEY_ALIAS=$KEY_ALIAS"
            echo "HC_UPLOAD_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build the bundle and a debug build for the emulator
        working-directory: android
        run: ./gradlew --no-daemon bundleRelease assembleDebug

      - name: Permissions and 16 KB alignment
        run: node scripts/android_manifest_check.js

      # Play refuses an update signed with any key but the one the first
      # upload used, so a wrong secret would only show up as a rejection on
      # Trey's phone. This says so here instead. The fingerprint is public;
      # the key it belongs to is in the HC_UPLOAD_* secrets.
      # PLAY_SUBMISSION_KIT.md section 4.
      - name: Signed with the church's upload key
        env:
          UPLOAD_KEY_SHA256: '4C:45:A3:6C:91:87:71:3C:59:58:BF:39:02:71:10:B2:03:D9:1A:90:49:11:92:28:A3:5C:EC:DD:AF:40:37:83'
        run: |
          if [ -z "$HC_UPLOAD_STORE_FILE" ]; then
            echo "No upload key in this repository's secrets, so this bundle is unsigned and only a check."
            exit 0
          fi
          got=$(keytool -printcert -jarfile android/app/build/outputs/bundle/release/app-release.aab 2>/dev/null \
            | grep -m1 'SHA256:' | awk '{print $2}')
          echo "Signed with $got"
          if [ "$got" != "$UPLOAD_KEY_SHA256" ]; then
            echo "That is not the church's upload key ($UPLOAD_KEY_SHA256). Play would refuse this bundle."
            exit 1
          fi

      # The version comes from versionName in build.gradle, which /new-build
      # raises with each App Store version, so the file name never goes stale.
      - name: Name the bundle after its version
        run: |
          mkdir -p out
          version=$(sed -n 's/^ *versionName "\(.*\)".*/\1/p' android/app/build.gradle)
          if [ -z "$version" ]; then
            echo "No versionName in android/app/build.gradle."
            exit 1
          fi
          cp android/app/build/outputs/bundle/release/app-release.aab \
            "out/home-church-${version}-build-${HC_VERSION_CODE}.aab"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: home-church-android-aab
          path: out/*.aab
          retention-days: 30

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  screens:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Node 22 for its built in fetch and WebSocket, which is all
      # scripts/android_screens.js needs to talk to the app's WebView.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: debug-apk
          path: apk

      - name: Let the emulator use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the app on an Android phone emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: sh scripts/android_emulator.sh apk/app-debug.apk android-screens

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: android-screens
          path: android-screens
          retention-days: 30
