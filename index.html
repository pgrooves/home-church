<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Home Church</title>

  <!-- iOS: cover the notch, then pad with env(safe-area-inset-*) in CSS. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Home Church">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#F7F4EF">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Home Church, Metairie. Sermons, small group guides, and a way in.">

  <!-- Every path is relative. Capacitor serves from a local origin and a
       leading slash breaks there. -->
  <link rel="manifest" href="manifest.webmanifest">
  <!-- ?v=2 busts Safari's favicon cache, which is separate from and stickier
       than its normal page cache, private browsing does not clear it either.
       Bump this any time the icon file itself changes again. -->
  <link rel="icon" type="image/png" href="assets/icons/favicon.png?v=2">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon-180.png?v=2">

  <!-- Fonts are the only remote asset. The system-sans and serif fallback
       stacks in tokens.css carry the design on their own if this never
       arrives. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Poppins:wght@800&display=swap">

  <!-- ?v=N on every local asset. Content lives in js/data.js and changes
       every week, and without this a returning phone keeps serving last
       week's copy from cache, Safari most stubbornly. Bump this number in
       all of the tags below whenever anything in css/ or js/ changes, which
       both NEW_GUIDE_PROCESS.md and NEW_PODCAST_PROCESS.md call out as a
       step. It is the no-build-step version of a content hash. -->
  <link rel="stylesheet" href="css/tokens.css?v=8">
  <link rel="stylesheet" href="css/base.css?v=8">
  <link rel="stylesheet" href="css/components.css?v=8">
  <link rel="stylesheet" href="css/screens.css?v=8">
  <link rel="stylesheet" href="css/print.css?v=8">
</head>
<body>
  <div id="app" role="application" aria-label="Home Church"></div>

  <noscript>
    <div style="padding:24px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
      <p>This app needs JavaScript turned on. Once it is, everything here works offline.</p>
    </div>
  </noscript>

  <script src="js/data.js?v=8"></script>
  <script src="js/store.js?v=8"></script>
  <!-- Empty until js/config.js is filled in, see that file. Once it is, this
       is the app's only network traffic besides the font. -->
  <script src="js/config.js?v=8"></script>
  <script src="js/auth.js?v=8"></script>
  <!-- Fills HC.data from Supabase after the first paint. Needs data.js,
       store.js, and config.js above it, and nothing below it. -->
  <script src="js/content.js?v=8"></script>
  <script src="js/components.js?v=8"></script>
  <script src="js/print-guide.js?v=8"></script>
  <script src="js/router.js?v=8"></script>
  <script src="js/screens/guide.js?v=8"></script>
  <script src="js/screens/home.js?v=8"></script>
  <script src="js/screens/listen.js?v=8"></script>
  <script src="js/screens/connect.js?v=8"></script>
  <script src="js/screens/give.js?v=8"></script>
  <script src="js/screens/profile.js?v=8"></script>
  <script src="js/screens/leader.js?v=8"></script>
  <script src="js/screens/legal.js?v=8"></script>
  <script src="js/app.js?v=8"></script>
</body>
</html>
