<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 92" role="img" aria-label="Home Church">
  <title>Home Church</title>
  <!--
    The Home Church mark, redrawn as vector: a thin gold house outline with a
    heavier cross inside, the base opening into a speech bubble tail. Replace
