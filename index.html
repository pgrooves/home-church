<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Home Church</title>

  <!-- iOS: cover the notch, then pad with env(safe-area-inset-*) in CSS. -->
  <!-- user-scalable=no came out. Safari has ignored it for years so it looked
       harmless, but WKWebView honors it, which means it would have taken pinch
       zoom away for real the moment this was packaged. The app has its own
       text size control, and that is an addition to system zoom rather than a
       replacement for it. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Home Church">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#F7F4EF">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Home Church, Metairie. Sermons, small group guides, and a way in.">

  <!-- Every path is relative. Capacitor serves from a local origin and a
       leading slash breaks there. -->
  <link rel="manifest" href="manifest.webmanifest">
  <!-- The stamp busts Safari's favicon cache, which is separate from and
       stickier than its normal page cache, and private browsing does not
       clear it either. -->
  <link rel="icon" type="image/png" href="assets/icons/favicon.png?v=b333ff03">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon-180.png?v=b333ff03">

  <!-- Typefaces ship with the app. They used to come from Google on every
       cold launch, which was a render blocking third party request that also
       handed Google every user's network address. Inside a packaged app there
       was never a reason for it. See css/fonts.css. -->
  <link rel="stylesheet" href="css/fonts.css?v=b333ff03">

  <!-- DO NOT EDIT THESE STAMPS BY HAND. `npm run stamp` writes every ?v= in
       this file from a hash of css/ and js/, so they all move together and
       none of them can be forgotten. Without a stamp a returning phone keeps
       serving last week's JavaScript from cache, Safari most stubbornly, and
       the failure is quiet: the app works, it is just the old one.
       See scripts/stamp_assets.js. -->
  <link rel="stylesheet" href="css/tokens.css?v=b333ff03">
  <link rel="stylesheet" href="css/base.css?v=b333ff03">
  <link rel="stylesheet" href="css/components.css?v=b333ff03">
  <link rel="stylesheet" href="css/screens.css?v=b333ff03">
  <link rel="stylesheet" href="css/print.css?v=b333ff03">
</head>
<body>
  <!-- No role="application" here. That role tells a screen reader to stop
       interpreting the page and hand nearly every keystroke to the app, which
       is right for a canvas editor and wrong for something people mostly read.
       It was costing VoiceOver users the ordinary reading controls on a screen
       full of prose. The landmarks inside the shell do the real work. -->
  <div id="app"></div>

  <noscript>
    <div style="padding:24px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
      <p>This app needs JavaScript turned on. Once it is, everything here works offline.</p>
    </div>
  </noscript>

  <script src="js/data.js?v=b333ff03"></script>
  <script src="js/store.js?v=b333ff03"></script>
  <!-- Share sheet, calendar, haptics, notifications. Works in a browser
       too, quietly, so nothing below has to check where it is running. -->
  <script src="js/native.js?v=b333ff03"></script>
  <!-- Empty until js/config.js is filled in, see that file. Now that the
       typefaces ship with the app, Supabase is the only network traffic the
       app makes on its own. -->
  <script src="js/config.js?v=b333ff03"></script>
  <script src="js/auth.js?v=b333ff03"></script>
  <!-- Fills HC.data from Supabase after the first paint. Needs data.js,
       store.js, and config.js above it, and nothing below it. -->
  <script src="js/content.js?v=b333ff03"></script>
  <script src="js/components.js?v=b333ff03"></script>
  <script src="js/print-guide.js?v=b333ff03"></script>
  <script src="js/router.js?v=b333ff03"></script>
  <script src="js/screens/guide.js?v=b333ff03"></script>
  <script src="js/screens/home.js?v=b333ff03"></script>
  <script src="js/screens/listen.js?v=b333ff03"></script>
  <script src="js/screens/connect.js?v=b333ff03"></script>
  <script src="js/screens/give.js?v=b333ff03"></script>
  <script src="js/screens/profile.js?v=b333ff03"></script>
  <script src="js/screens/leader.js?v=b333ff03"></script>
  <script src="js/screens/legal.js?v=b333ff03"></script>
  <script src="js/app.js?v=b333ff03"></script>
</body>
</html>
