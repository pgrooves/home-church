<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Home Church</title>

  <!-- iOS: cover the notch, then pad with env(safe-area-inset-*) in CSS. -->
  <!-- user-scalable=no came out. Safari has ignored it for years so it looked
       harmless, but WKWebView honors it, which means it would have taken pinch
       zoom away for real the moment this was packaged. The app has its own
       text size control, and that is an addition to system zoom rather than a
       replacement for it. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Home Church">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#F7F4EF">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Home Church, Metairie. Sermons, small group guides, and a way in.">

  <!-- Every path is relative. Capacitor serves from a local origin and a
       leading slash breaks there. -->
  <link rel="manifest" href="manifest.webmanifest">
  <!-- The stamp busts Safari's favicon cache, which is separate from and
       stickier than its normal page cache, and private browsing does not
       clear it either.

       These carry ?i= and not ?v=, and the difference matters. ?v= is a hash
       of css/ and js/, so it moves when the code moves and sits still when the
       icons change, which is backwards for a cache keyed on this URL. That is
       not hypothetical: the icons were redrawn from paper-colored to dark and
       kept both their filenames and their stamp, so every phone that had ever
       loaded the old ones went on showing the old ones. ?i= is a hash of
       assets/icons/, written by the same script. Redraw an icon, the URL moves.

       Both appearances point at the same file on purpose. The mark is drawn on
       its own dark ground, and it should stay that way on a light Home Screen
       rather than being lightened to match one. iOS is inconsistent about
       honoring media here; when it ignores these it falls back to the first
       link, which is the same image, so the answer is the same either way. -->
  <link rel="icon" type="image/png" href="assets/icons/favicon.png?i=663e3858">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon-180.png?i=663e3858">
  <link rel="apple-touch-icon" media="(prefers-color-scheme: light)" href="assets/icons/apple-touch-icon-180.png?i=663e3858">
  <link rel="apple-touch-icon" media="(prefers-color-scheme: dark)" href="assets/icons/apple-touch-icon-180.png?i=663e3858">

  <!-- Typefaces ship with the app. They used to come from Google on every
       cold launch, which was a render blocking third party request that also
       handed Google every user's network address. Inside a packaged app there
       was never a reason for it. See css/fonts.css. -->
  <link rel="stylesheet" href="css/fonts.css?v=ac02196b">

  <!-- DO NOT EDIT THESE STAMPS BY HAND. `npm run stamp` writes every ?v= in
       this file from a hash of css/ and js/, so they all move together and
       none of them can be forgotten. Without a stamp a returning phone keeps
       serving last week's JavaScript from cache, Safari most stubbornly, and
       the failure is quiet: the app works, it is just the old one.
       See scripts/stamp_assets.js. -->
  <link rel="stylesheet" href="css/tokens.css?v=ac02196b">
  <link rel="stylesheet" href="css/base.css?v=ac02196b">
  <link rel="stylesheet" href="css/components.css?v=ac02196b">
  <link rel="stylesheet" href="css/screens.css?v=ac02196b">
  <link rel="stylesheet" href="css/print.css?v=ac02196b">
</head>
<body>
  <!-- No role="application" here. That role tells a screen reader to stop
       interpreting the page and hand nearly every keystroke to the app, which
       is right for a canvas editor and wrong for something people mostly read.
       It was costing VoiceOver users the ordinary reading controls on a screen
       full of prose. The landmarks inside the shell do the real work. -->
  <!-- The screen before the Home tab. It is in the document rather than
       rendered by JavaScript because it has to be on the glass at first
       paint: build it in a script and the blank moment it exists to cover is
       the moment you would see. The name is filled in by js/splash.js a few
       milliseconds later, while the greeting is still at zero opacity, and
       the whole layer takes itself away once Home is painted underneath.

       "Welcome home." is what ships in the markup, which is also what a
       signed out phone, and a genuinely first launch, keeps. -->
  <div id="hc-splash" class="hc-splash">
    <div class="hc-splash__markwrap">
      <img class="hc-splash__mark" src="assets/icons/mark.png?i=663e3858" alt="Home Church">
      <span class="hc-splash__gleam" aria-hidden="true"></span>
    </div>
    <p class="hc-splash__greeting" id="hc-splash-greeting">Welcome home.</p>
    <p class="hc-splash__loading">Loading...</p>
  </div>

  <div id="app"></div>

  <noscript>
    <div style="padding:24px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
      <p>This app needs JavaScript turned on. Once it is, everything here works offline.</p>
    </div>
  </noscript>

  <script src="js/data.js?v=ac02196b"></script>
  <script src="js/store.js?v=ac02196b"></script>
  <!-- The greeting that is already on screen. Needs store.js above it for the
       first name and the theme, and nothing below it: app.js tells it when
       Home is ready, and it does the rest on its own. -->
  <script src="js/splash.js?v=ac02196b"></script>
  <!-- Share sheet, calendar, haptics, notifications. Works in a browser
       too, quietly, so nothing below has to check where it is running. -->
  <script src="js/native.js?v=ac02196b"></script>
  <!-- Empty until js/config.js is filled in, see that file. Now that the
       typefaces ship with the app, Supabase is the only network traffic the
       app makes on its own. -->
  <script src="js/config.js?v=ac02196b"></script>
  <script src="js/auth.js?v=ac02196b"></script>
  <!-- Fills HC.data from Supabase after the first paint. Needs data.js,
       store.js, and config.js above it, and nothing below it. -->
  <script src="js/content.js?v=ac02196b"></script>
  <!-- The allowlist markup somebody typed comes through, plus the plain text
       mirror of it. Read by admin.js, journal.js and editor.js below, under
       their own link policies. Depends on nothing itself. -->
  <script src="js/richtext.js?v=ac02196b"></script>
  <!-- Everything Settings -> Admin reads and writes. Needs auth.js above it
       for the session, content.js for the refresh it fires after a write, and
       richtext.js for the words on an announcement.
       Draws nothing: js/screens/admin.js below is the screen. -->
  <script src="js/admin.js?v=ac02196b"></script>
  <!-- Editing a sentence where it is written, for the half hour an admin has
       edit mode on. Needs auth.js above it for the session and content.js for
       the refresh after a write; every screen below it calls HC.edit.wrap()
       around the sentences it is willing to have changed. -->
  <script src="js/edit-mode.js?v=ac02196b"></script>
  <!-- The Journal's data layer. Needs store.js for the cache and auth.js for
       who is signed in, and js/screens/journal.js below it. -->
  <script src="js/journal.js?v=ac02196b"></script>
  <!-- The nine practices, read from the static files under data/practices/.
       Needs store.js above it to emit, and js/screens/practices.js below it.
       No network beyond the app's own bundle: see the header of that file. -->
  <script src="js/practices.js?v=ac02196b"></script>
  <!-- Sixty-six books and the length of every chapter, for the scripture
       picker. Data only, and js/editor.js below is the only thing that reads
       it. -->
  <script src="js/bible.js?v=ac02196b"></script>
  <script src="js/components.js?v=ac02196b"></script>
  <!-- The writing surface in the Journal. Needs components.js above it for
       esc() and the icons, and bible.js for the scripture sheet. -->
  <script src="js/editor.js?v=ac02196b"></script>
  <!-- Selecting words in a guide and keeping them. Needs editor.js above it
       for the note sheet's writing surface. -->
  <script src="js/highlight.js?v=ac02196b"></script>
  <script src="js/print-guide.js?v=ac02196b"></script>
  <!-- The index behind the magnifying glass in the top bar. It reads
       js/data.js, js/practices.js and js/journal.js above it, and draws the
       screens through js/router.js below it, but it does all of that the
       first time somebody searches rather than on load, so the only thing
       that has to be above this line is js/store.js, whose events tell it
       when the content underneath it has moved. -->
  <script src="js/search.js?v=ac02196b"></script>
  <script src="js/router.js?v=ac02196b"></script>
  <!-- The month strip under the header on Listen. Shell chrome, so it loads
       with the router rather than with the screen it serves. -->
  <script src="js/date-rail.js?v=ac02196b"></script>
  <!-- Swiping sideways between the five tabs. Shell chrome like the rail
       above, and it needs the router, which is why it sits here. -->
  <script src="js/swipe.js?v=ac02196b"></script>
  <!-- The right edge, in place of the scrollbar. Shell chrome again, and it
       reads the same finger swipe.js reads, so it goes next to it. -->
  <script src="js/index-rail.js?v=ac02196b"></script>
  <!-- The Group tab's data layer. Needs auth.js above it for the transport
       and store.js for the cache, and js/screens/group.js below it. -->
  <script src="js/rooms.js?v=ac02196b"></script>
  <script src="js/screens/guide.js?v=ac02196b"></script>
  <script src="js/screens/home.js?v=ac02196b"></script>
  <script src="js/screens/listen.js?v=ac02196b"></script>
  <script src="js/screens/connect.js?v=ac02196b"></script>
  <!-- The ••• tile. Five tabs swipe, everything else is a module listed here. -->
  <script src="js/screens/more.js?v=ac02196b"></script>
  <!-- What the band played on Sunday, a week at a time. First of the modules
       behind •••, and the last screen that belongs to Sunday morning. -->
  <script src="js/screens/worship.js?v=ac02196b"></script>
  <!-- The grid of nine, and the one page all nine are drawn with. -->
  <script src="js/screens/practices.js?v=ac02196b"></script>
  <!-- Alpha, one page, straight after Practices behind ••• and next to it for
       the same reason it sits next to it in the sheet: somebody else's course,
       gathered here. Needs components.js above it for the play badge and the
       numbered question row, and nothing below it. -->
  <script src="js/screens/alpha.js?v=ac02196b"></script>
  <script src="js/screens/journal.js?v=ac02196b"></script>
  <!-- One screen that draws any row in content_pages. Above give.js because
       Give reads its paragraph helper. -->
  <script src="js/screens/page.js?v=ac02196b"></script>
  <!-- One announcement, on its own page, opened from the card on Home. Below
       page.js because it draws a plain text announcement with the same
       paragraph helper Give uses. -->
  <script src="js/screens/announcement.js?v=ac02196b"></script>
  <script src="js/screens/give.js?v=ac02196b"></script>
  <script src="js/screens/profile.js?v=ac02196b"></script>
  <!-- Announcements, users, content and app settings. Drawn only for an
       admin, and refused by the database for everybody else. -->
  <script src="js/screens/admin.js?v=ac02196b"></script>
  <script src="js/screens/group.js?v=ac02196b"></script>
  <script src="js/screens/leader.js?v=ac02196b"></script>
  <script src="js/screens/legal.js?v=ac02196b"></script>
  <!-- The box and the list under it. Last of the screens, because the index
       behind it draws the others for their words, and because being last
       means a screen added later is on that index without anybody having to
       move this line. -->
  <script src="js/screens/search.js?v=ac02196b"></script>
  <script src="js/app.js?v=ac02196b"></script>
</body>
</html>
